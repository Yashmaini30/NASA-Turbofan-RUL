<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NASA Turbofan RUL{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="{{ url_for('dashboard') }}" class="text-xl font-bold flex items-center gap-3 hover:text-blue-400 transition">
                    <i class="fas fa-jet text-blue-500"></i>
                    <span>NASA Turbofan RUL</span>
                </a>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="{{ url_for('dashboard') }}" class="hover:text-blue-400 transition font-medium">Dashboard</a>
                    <a href="{{ url_for('results_showcase') }}" class="hover:text-blue-400 transition font-medium">Results</a>
                    <div class="relative group">
                        <button class="flex items-center gap-1 hover:text-blue-400 transition font-medium">
                            Datasets <i class="fas fa-chevron-down text-xs"></i>
                        </button>
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl py-2 hidden group-hover:block text-slate-800 border border-slate-100">
                            {% for dataset in datasets %}
                            <a href="{{ url_for('dataset_detail', dataset_name=dataset) }}" class="block px-4 py-2 hover:bg-slate-50 hover:text-blue-600">
                                {{ dataset }}
                            </a>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 mt-auto">
        <div class="container mx-auto px-6 text-center">
            <p class="mb-2">Minor Project Evaluation 2025</p>
            <p class="text-sm">Implemented with <i class="fas fa-heart text-red-500 mx-1"></i> using PyTorch & Flask</p>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="imageModal" class="fixed inset-0 z-[60] hidden bg-black/90 flex items-center justify-center p-4" onclick="closeModal()">
        <div class="relative max-w-7xl w-full max-h-screen flex flex-col items-center">
            <button onclick="closeModal()" class="absolute -top-12 right-0 text-white hover:text-gray-300 text-3xl">
                <i class="fas fa-times"></i>
            </button>
            <img id="modalImage" src="" class="max-h-[85vh] object-contain rounded-lg shadow-2xl" alt="Full size view">
            <h3 id="modalTitle" class="text-white mt-4 text-xl font-medium"></h3>
        </div>
    </div>

    <script>
        function showImageModal(img) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            
            modalImg.src = img.src;
            modalTitle.textContent = img.alt;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Close on escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
